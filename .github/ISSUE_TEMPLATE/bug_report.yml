name: Bug report
description: Something in SentinelOps does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the exact error text. Do not paste tokens, passwords or private logs. }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version and platform, placeholder: "0.1.0, Windows 11 desktop app" }
  - type: textarea
    id: logs
    attributes: { label: Relevant server log lines (redacted), render: text }
